services:
  # LiteLLM proxy: routes to Gemini primary/fallback, and optionally to a
  # locally-served vLLM model (see scripts/serve_local_model.sh, run
  # separately - it needs GPU access this compose file does not manage).
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    ports:
      - "4000:4000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # FastAPI backend: wraps the RAG pipeline (retrieval + LLM call) with
  # caching, retry, rate limiting, and async request handling.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LITELLM_PROXY_URL=http://litellm:4000
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./rag_app/rag_docs:/app/rag_app/rag_docs
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped

  # Streamlit UI: talks only to the backend over HTTP, no direct LLM/DB access.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - RAG_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
